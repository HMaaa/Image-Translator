<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 번역기</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #6b7280;
    --accent: #2563eb; --accent-hover: #1d4ed8; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1b1f26; --text: #e7eaee; --muted: #9aa3af;
      --accent: #3b82f6; --accent-hover: #60a5fa; --border: #2a3038;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    max-width: 860px; margin: 0 auto; padding: 2rem 1rem;
  }
  h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  .sub { color: var(--muted); margin-bottom: 1.5rem; font-size: .95rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
  }
  #drop {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 2.5rem 1rem; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop.dragover { border-color: var(--accent); background: rgba(37,99,235,.06); }
  #drop p { color: var(--muted); }
  #drop strong { color: var(--accent); }
  #preview { max-width: 100%; max-height: 320px; border-radius: 8px; margin-top: 1rem; display: none; }
  .controls { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin-top: 1rem; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .25rem; }
  select, input[type=password], input[type=text], textarea {
    padding: .5rem .6rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: .95rem;
    font-family: inherit;
  }
  input[type=password], textarea { width: 100%; }
  label code { font-size: .75rem; }
  button {
    padding: .6rem 1.4rem; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 640px) { .results { grid-template-columns: 1fr; } }
  .results h2 { font-size: .9rem; color: var(--muted); margin-bottom: .5rem; }
  .box-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
  .copy { background: none; border: 1px solid var(--border); color: var(--muted); padding: .2rem .6rem; font-size: .75rem; }
  .copy:hover { background: var(--border); }
  pre {
    white-space: pre-wrap; word-break: break-word;
    font-family: inherit; font-size: .95rem; line-height: 1.6; min-height: 6rem;
  }
  #status { margin: .75rem 0; font-size: .9rem; color: var(--muted); min-height: 1.2rem; }
  #status.error { color: #dc2626; }
  input[type=file] { display: none; }
</style>
</head>
<body>
  <h1>🖼️ 이미지 번역기</h1>
  <p class="sub">이미지를 업로드하면 이미지 속 텍스트를 번역문으로 치환한 이미지를 만들어 줍니다. (붙여넣기 Ctrl+V 지원)</p>

  <div class="card">
    <div id="drop">
      <p><strong>클릭</strong>하거나 이미지를 <strong>드래그</strong>하세요 · 클립보드 <strong>붙여넣기</strong>도 가능</p>
      <img id="preview" alt="미리보기">
    </div>
    <input type="file" id="fileInput" accept="image/*">
    <div class="controls">
      <div>
        <label for="ocrLang">이미지 속 언어 (OCR)</label>
        <select id="ocrLang">
          <option value="auto">자동 (한/영/일/중)</option>
          <option value="eng">영어</option>
          <option value="kor">한국어</option>
          <option value="jpn">일본어</option>
          <option value="chi_sim">중국어 (간체)</option>
        </select>
      </div>
      <div>
        <label for="targetLang">번역할 언어</label>
        <select id="targetLang">
          <option value="ko">한국어</option>
          <option value="en">영어</option>
          <option value="ja">일본어</option>
          <option value="zh-CN">중국어 (간체)</option>
          <option value="es">스페인어</option>
          <option value="fr">프랑스어</option>
          <option value="de">독일어</option>
        </select>
      </div>
      <button id="go" disabled>번역하기</button>
    </div>
    <div class="controls">
      <div style="flex:1;min-width:220px">
        <label for="apiKey">OpenAI API 키 (필수)</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
      </div>
      <div>
        <label for="model">모델</label>
        <input type="text" id="model" value="gpt-5.5">
      </div>
    </div>
    <div class="controls">
      <div style="flex:1">
        <label for="glossary">사용자 사전 (선택) — 한 줄에 하나씩 <code>원문=번역</code> 형식. 번역 시 반드시 이 표기를 따릅니다</label>
        <textarea id="glossary" rows="3" placeholder="예)&#10;Acme Corp=아크메&#10;free shipping=무료 배송"></textarea>
      </div>
    </div>
    <div id="status"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="box-head">
      <h2 style="font-size:.9rem;color:var(--muted)">번역된 이미지</h2>
      <a id="download" download="translated.png"><button class="copy">다운로드</button></a>
    </div>
    <img id="resultImg" style="max-width:100%;border-radius:8px" alt="번역된 이미지">
  </div>

  <div class="results">
    <div class="card">
      <div class="box-head"><h2>추출된 텍스트</h2><button class="copy" data-target="extracted">복사</button></div>
      <pre id="extracted"></pre>
    </div>
    <div class="card">
      <div class="box-head"><h2>번역 결과</h2><button class="copy" data-target="translated">복사</button></div>
      <pre id="translated"></pre>
    </div>
  </div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const go = document.getElementById('go');
const status = document.getElementById('status');
let currentFile = null;

function setFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    setStatus('이미지 파일만 업로드할 수 있습니다.', true);
    return;
  }
  currentFile = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'inline-block';
  go.disabled = false;
  setStatus('');
}

function setStatus(msg, isError = false) {
  status.textContent = msg;
  status.className = isError ? 'error' : '';
}

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => setFile(fileInput.files[0]));

['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('dragover');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('dragover');
}));
drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

document.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) setFile(item.getAsFile());
});

go.addEventListener('click', async () => {
  if (!currentFile) return;
  go.disabled = true;
  setStatus('텍스트 추출 및 번역 중...');
  document.getElementById('extracted').textContent = '';
  document.getElementById('translated').textContent = '';
  document.getElementById('resultCard').style.display = 'none';

  const form = new FormData();
  form.append('file', currentFile);
  form.append('ocr_lang', document.getElementById('ocrLang').value);
  form.append('target_lang', document.getElementById('targetLang').value);
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    setStatus('OpenAI API 키를 입력해 주세요.', true);
    go.disabled = false;
    return;
  }
  form.append('api_key', apiKey);
  form.append('model', document.getElementById('model').value.trim());
  form.append('glossary', document.getElementById('glossary').value);

  try {
    const res = await fetch('/api/translate', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '요청 실패');
    document.getElementById('extracted').textContent = data.extracted;
    document.getElementById('translated').textContent = data.translated;
    if (data.image) {
      document.getElementById('resultImg').src = data.image;
      document.getElementById('download').href = data.image;
      document.getElementById('resultCard').style.display = 'block';
    }
    setStatus(data.message || (data.engine ? `완료! (${data.engine})` : '완료!'));
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    go.disabled = false;
  }
});

// API 키/모델/사용자 사전을 브라우저에 저장해서 다시 입력하지 않아도 되게 한다
const persisted = [
  ['apiKey', 'openaiApiKey', ''],
  ['model', 'openaiModel', 'gpt-5.5'],
  ['glossary', 'userGlossary', ''],
];
for (const [id, key, def] of persisted) {
  const el = document.getElementById(id);
  el.value = localStorage.getItem(key) || def;
  el.addEventListener('input', () => localStorage.setItem(key, el.value));
}

document.querySelectorAll('.copy').forEach(btn => {
  btn.addEventListener('click', async () => {
    const text = document.getElementById(btn.dataset.target).textContent;
    if (!text) return;
    await navigator.clipboard.writeText(text);
    btn.textContent = '복사됨!';
    setTimeout(() => btn.textContent = '복사', 1200);
  });
});
</script>
</body>
</html>
