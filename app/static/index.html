<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 번역기</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #6b7280;
    --accent: #2563eb; --accent-hover: #1d4ed8; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1b1f26; --text: #e7eaee; --muted: #9aa3af;
      --accent: #3b82f6; --accent-hover: #60a5fa; --border: #2a3038;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;
  }
  h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  h2 { font-size: .95rem; margin-bottom: .75rem; }
  .sub { color: var(--muted); margin-bottom: 1.5rem; font-size: .95rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
  }
  /* 가로 3단 배치: 이미지 | 사전 | 설정 */
  .top-grid {
    display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 1rem;
    align-items: stretch; margin-bottom: 1rem;
  }
  .top-grid .card { margin-bottom: 0; display: flex; flex-direction: column; }
  @media (max-width: 900px) { .top-grid { grid-template-columns: 1fr; } }

  #drop {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 1.5rem 1rem; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s; flex: 1;
    display: flex; flex-direction: column; justify-content: center; gap: .5rem;
  }
  #drop.dragover { border-color: var(--accent); background: rgba(37,99,235,.06); }
  #drop p { color: var(--muted); font-size: .9rem; }
  #drop strong { color: var(--accent); }
  #preview { max-width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px; display: none; margin: 0 auto; }

  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .25rem; }
  .field { margin-bottom: .75rem; }
  select, input[type=password], input[type=text], textarea {
    padding: .5rem .6rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: .9rem;
    font-family: inherit; width: 100%;
  }
  #glossary { flex: 1; min-height: 180px; resize: vertical; }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem .75rem; }
  .settings-grid .field { margin-bottom: 0; }

  .action-row { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
  button {
    padding: .7rem 1.6rem; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .prompt-wrap { flex: 1; min-width: 260px; }
  #finalPrompt {
    font-family: ui-monospace, monospace; font-size: .8rem;
    min-height: 7rem; resize: vertical; color: var(--muted);
  }
  #status { margin-top: .75rem; font-size: .9rem; color: var(--muted); min-height: 1.2rem; }
  #status.error { color: #dc2626; }

  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 640px) { .results { grid-template-columns: 1fr; } }
  .box-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
  .box-head h2 { margin-bottom: 0; color: var(--muted); font-size: .9rem; }
  .copy { background: none; border: 1px solid var(--border); color: var(--muted); padding: .2rem .6rem; font-size: .75rem; }
  .copy:hover { background: var(--border); }
  pre { white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: .95rem; line-height: 1.6; min-height: 6rem; }
  input[type=file] { display: none; }
</style>
</head>
<body>
  <h1>🖼️ 이미지 번역기</h1>
  <p class="sub">이미지를 업로드하면 GPT가 텍스트를 번역하고, GPT 이미지 2.0이 번역문으로 치환된 이미지를 생성합니다.</p>

  <div class="top-grid">
    <!-- 1단: 이미지 -->
    <div class="card">
      <h2>이미지</h2>
      <div id="drop">
        <p><strong>클릭</strong> · <strong>드래그</strong> · <strong>붙여넣기</strong>(Ctrl+V)</p>
        <img id="preview" alt="미리보기">
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- 2단: 사용자 사전 -->
    <div class="card">
      <h2>사용자 사전</h2>
      <label for="glossary">한 줄에 하나씩 <code>원문=번역</code> — 번역 시 반드시 이 표기를 따릅니다</label>
      <textarea id="glossary" placeholder="예)&#10;Acme Corp=아크메&#10;free shipping=무료 배송"></textarea>
    </div>

    <!-- 3단: 설정 -->
    <div class="card">
      <h2>설정</h2>
      <div class="field">
        <label for="apiKey">OpenAI API 키 (필수)</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
      </div>
      <div class="settings-grid">
        <div class="field">
          <label for="targetLang">번역할 언어</label>
          <select id="targetLang">
            <option value="ko">한국어</option>
            <option value="en">영어</option>
            <option value="ja">일본어</option>
            <option value="zh-CN">중국어 (간체)</option>
            <option value="es">스페인어</option>
            <option value="fr">프랑스어</option>
            <option value="de">독일어</option>
          </select>
        </div>
        <div class="field">
          <label for="accuracy">번역 정확도</label>
          <select id="accuracy">
            <option value="fast">빠름</option>
            <option value="balanced" selected>균형</option>
            <option value="precise">정밀</option>
          </select>
        </div>
        <div class="field">
          <label for="analysisModel">분석 모델</label>
          <select id="analysisModel">
            <option value="fast" selected>빠름 (gpt-5.4-mini)</option>
            <option value="pro">프로 (gpt-5.5)</option>
          </select>
        </div>
        <div class="field">
          <label for="generationModel">생성 모델</label>
          <select id="generationModel">
            <option value="pro" selected>프로 (gpt-image-2)</option>
            <option value="fast">빠름 (gpt-image-1-mini)</option>
          </select>
        </div>
        <div class="field">
          <label for="enhance">이미지 보정</label>
          <select id="enhance">
            <option value="none" selected>없음</option>
            <option value="sharpen">선명하게</option>
            <option value="clean">노이즈/배경 정리</option>
          </select>
        </div>
        <div class="field">
          <label for="outputSize">출력 파일</label>
          <select id="outputSize">
            <option value="1k" selected>1K</option>
            <option value="2k">2K</option>
            <option value="4k">4K</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- 실행 + 최종 프롬프트 -->
  <div class="card">
    <div class="action-row">
      <button id="go" disabled>이미지 번역</button>
      <div class="prompt-wrap">
        <label for="finalPrompt">최종 프롬프트 (이미지 생성 모델에 전달되는 내용)</label>
        <textarea id="finalPrompt" readonly></textarea>
      </div>
    </div>
    <div id="status"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="box-head">
      <h2>번역된 이미지</h2>
      <a id="download" download="translated.png"><button class="copy">다운로드</button></a>
    </div>
    <img id="resultImg" style="max-width:100%;border-radius:8px" alt="번역된 이미지">
  </div>

  <div class="results">
    <div class="card">
      <div class="box-head"><h2>추출된 텍스트</h2><button class="copy" data-target="extracted">복사</button></div>
      <pre id="extracted"></pre>
    </div>
    <div class="card">
      <div class="box-head"><h2>번역 결과</h2><button class="copy" data-target="translated">복사</button></div>
      <pre id="translated"></pre>
    </div>
  </div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const go = document.getElementById('go');
const status = document.getElementById('status');
let currentFile = null;

const LANG_NAMES = { ko: 'Korean', en: 'English', ja: 'Japanese', 'zh-CN': 'Simplified Chinese', es: 'Spanish', fr: 'French', de: 'German' };
const ENHANCE_NOTES = {
  none: '',
  sharpen: 'Also subtly enhance overall sharpness and clean up compression artifacts.',
  clean: 'Also clean up the image: remove noise and compression artifacts, and make the background around replaced text uniform and tidy.',
};

// 서버의 build_generation_prompt와 같은 형식으로 최종 프롬프트를 미리 보여준다.
// 번역 목록은 분석이 끝나야 채워지므로 실행 전에는 자리표시자를 넣는다.
function buildPromptPreview(translationLines) {
  const lang = LANG_NAMES[document.getElementById('targetLang').value];
  const lines = translationLines || '(분석 모델이 만든 "원문" → "번역" 목록이 여기에 채워집니다)';
  let p = `Edit this image: replace every piece of visible text with its ${lang} translation below, as if the image had originally been made in ${lang}. Keep the layout, font style, text size, colors, and background exactly the same. Do not alter any non-text elements.\n\nTranslations to apply:\n${lines}`;
  const note = ENHANCE_NOTES[document.getElementById('enhance').value];
  if (note) p += `\n\n${note}`;
  return p;
}

function refreshPrompt() {
  document.getElementById('finalPrompt').value = buildPromptPreview(null);
}

function setFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    setStatus('이미지 파일만 업로드할 수 있습니다.', true);
    return;
  }
  currentFile = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  go.disabled = false;
  setStatus('');
}

function setStatus(msg, isError = false) {
  status.textContent = msg;
  status.className = isError ? 'error' : '';
}

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => setFile(fileInput.files[0]));

['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('dragover');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('dragover');
}));
drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

document.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) setFile(item.getAsFile());
});

go.addEventListener('click', async () => {
  if (!currentFile) return;
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    setStatus('OpenAI API 키를 입력해 주세요.', true);
    return;
  }
  go.disabled = true;
  setStatus('1단계: 텍스트 분석·번역 중... → 2단계: 이미지 생성 중... (수십 초 걸릴 수 있습니다)');
  document.getElementById('extracted').textContent = '';
  document.getElementById('translated').textContent = '';
  document.getElementById('resultCard').style.display = 'none';

  const form = new FormData();
  form.append('file', currentFile);
  form.append('target_lang', document.getElementById('targetLang').value);
  form.append('api_key', apiKey);
  form.append('analysis_model', document.getElementById('analysisModel').value);
  form.append('generation_model', document.getElementById('generationModel').value);
  form.append('accuracy', document.getElementById('accuracy').value);
  form.append('enhance', document.getElementById('enhance').value);
  form.append('output_size', document.getElementById('outputSize').value);
  form.append('glossary', document.getElementById('glossary').value);

  try {
    const res = await fetch('/api/translate', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '요청 실패');
    document.getElementById('extracted').textContent = data.extracted;
    document.getElementById('translated').textContent = data.translated;
    if (data.prompt) document.getElementById('finalPrompt').value = data.prompt;
    if (data.image) {
      document.getElementById('resultImg').src = data.image;
      document.getElementById('download').href = data.image;
      document.getElementById('resultCard').style.display = 'block';
    }
    setStatus(data.message || (data.engine ? `완료! (${data.engine})` : '완료!'));
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    go.disabled = false;
  }
});

document.querySelectorAll('.copy[data-target]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const text = document.getElementById(btn.dataset.target).textContent;
    if (!text) return;
    await navigator.clipboard.writeText(text);
    btn.textContent = '복사됨!';
    setTimeout(() => btn.textContent = '복사', 1200);
  });
});

// 입력값을 브라우저에 저장해서 다시 입력하지 않아도 되게 한다
const persisted = [
  ['apiKey', 'openaiApiKey'], ['glossary', 'userGlossary'],
  ['targetLang', 'targetLang'], ['accuracy', 'accuracy'],
  ['analysisModel', 'analysisModel'], ['generationModel', 'generationModel'],
  ['enhance', 'enhance'], ['outputSize', 'outputSize'],
];
for (const [id, key] of persisted) {
  const el = document.getElementById(id);
  const saved = localStorage.getItem(key);
  if (saved !== null) el.value = saved;
  el.addEventListener('input', () => localStorage.setItem(key, el.value));
  el.addEventListener('change', () => { localStorage.setItem(key, el.value); refreshPrompt(); });
}
refreshPrompt();
</script>
</body>
</html>
